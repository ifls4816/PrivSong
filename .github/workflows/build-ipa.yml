name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # Unsigned device build: CI has no signing certificate. The resulting IPA must be
      # re-signed (Sideloadly / AltStore / SideStore etc.) before it can be installed.
      - name: Build
        run: |
          xcodebuild build \
            -project PrivSong.xcodeproj \
            -target PrivSong \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 && status=0 || status=$?

          # Surface compiler diagnostics as annotations on the run page and on the code.
          grep -E "^/.+:[0-9]+:[0-9]+: (error|warning): " build.log | sort -u | head -100 \
            | sed -E "s#^$PWD/##; s#^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)#::\4 file=\1,line=\2,col=\3::\5#" \
            || true
          exit $status

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/*.app Payload/
          zip -qry PrivSong-unsigned.ipa Payload
          ls -lh PrivSong-unsigned.ipa

      # archive: false uploads the .ipa as-is, so the download is the IPA itself, not a zip.
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: PrivSong-unsigned.ipa
          archive: false
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 7

  test:
    name: Regression tests (iOS ${{ matrix.ios }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 26
            runner: macos-26
          - ios: 27
            runner: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Run simulator tests
        env:
          IOS_MAJOR: ${{ matrix.ios }}
        run: |
          set -o pipefail
          xcodebuild -version
          simulator="$(xcrun simctl list devices available --json | jq -r --arg ios "$IOS_MAJOR" '
            .devices | to_entries
            | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-" + $ios + "-")))
            | sort_by(.key) | reverse
            | [.[].value[] | select(.name | startswith("iPhone"))][0].udid // empty
          ')"
          if [ -z "$simulator" ]; then
            xcrun simctl list devices available
            echo "::error::No available iOS $IOS_MAJOR iPhone simulator on this runner."
            exit 1
          fi
          xcodebuild test \
            -project PrivSong.xcodeproj \
            -scheme PrivSong \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO \
            -resultBundlePath PrivSongTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-ios-${{ matrix.ios }}
          path: |
            test.log
            PrivSongTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
