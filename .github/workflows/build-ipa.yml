name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # Unsigned device build: CI has no signing certificate. The resulting IPA must be
      # re-signed (Sideloadly / AltStore / SideStore etc.) before it can be installed.
      - name: Build
        run: |
          xcodebuild build \
            -project PrivSong.xcodeproj \
            -target PrivSong \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -100; exit 1; }
          grep -E "warning:" build.log | sort -u | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/*.app Payload/
          zip -qry PrivSong-unsigned.ipa Payload
          ls -lh PrivSong-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrivSong-unsigned-ipa
          path: PrivSong-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
